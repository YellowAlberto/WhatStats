<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script>
        (function() {
            const temaGuardado = localStorage.getItem('whatsinchat-theme');
            const prefiereOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const esOscuro = temaGuardado ? temaGuardado === 'dark' : prefiereOscuro;
            if (esOscuro) document.documentElement.classList.add('dark');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>WhatsInChat · No se pudo procesar tu chat</title>
    <link rel="icon" type="image/svg+xml" href="/static/icono.svg">
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/fondo.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl shadow-2xl p-8 text-center space-y-5">
        <span class="text-5xl" aria-hidden="true">⚠️</span>
        <h1 class="text-xl font-extrabold text-rose-600 dark:text-rose-400">Algo no ha ido bien</h1>
        <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">{{ mensaje }}</p>
        <a href="/" class="inline-block bg-teal-400 hover:bg-teal-300 text-slate-950 font-black py-3 px-6 rounded-xl transition text-sm shadow-lg tracking-wide">⬅ Volver e intentarlo de nuevo</a>
    </div>

</body>
</html>
